services:
  auth-api:
    build: .
    container_name: microsservico-auth
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./app:/app/app
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo
    env_file:
      - ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo:/data/db
    ports:
      - "6000:27017"

volumes:
  mongo: